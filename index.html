<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carolines-Yarns | Premium Yarn & Crochet Tools</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }
    body {
      background-color: #F5F0EB;
      color: #2A2420;
      line-height: 1.6;
    }
    header {
      background: #fff;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      padding: 1rem 4%;
      position: sticky;
      top: 0;
      z-index: 999;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .nav-wrap {
      display: flex;
      gap: 32px;
    }
    .nav-wrap a {
      color: #2A2420;
      text-decoration: none;
      transition: 0.3s;
    }
    .nav-wrap a:hover {
      color: #8C7853;
    }
    .user-bar {
      display: flex;
      gap: 20px;
      align-items: center;
    }
    #loginBtn {
      background: transparent;
      border: none;
      font-size: 16px;
      cursor: pointer;
      color: #2A2420;
    }
    #loginBtn:hover {
      color: #8C7853;
    }
    /* 登录弹窗 最高层级 */
    #loginModal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 99999;
    }
    .modal-box {
      background: #fff;
      width: 90%;
      max-width: 450px;
      padding: 32px;
      border-radius: 8px;
      position: relative;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    }
    #closeLogin {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      color: #666;
    }
    .modal-box h2 {
      text-align: center;
      margin-bottom: 24px;
    }
    .form-item {
      margin-bottom: 16px;
    }
    .form-item label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
    }
    .form-item input {
      width: 100%;
      padding: 12px;
      border: 1px solid #eee;
      border-radius: 4px;
      font-size: 16px;
    }
    #submitLogin {
      width: 100%;
      padding: 14px;
      background: #2A2420;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 8px;
      transition: 0.3s;
    }
    #submitLogin:hover {
      background: #8C7853;
    }
    .tip-text {
      font-size: 12px;
      text-align: center;
      margin-top: 12px;
      color: #666;
    }
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 4%;
    }
    .hero-banner {
      width: 100%;
      height: 70vh;
      background: url('https://images.unsplash.com/photo-1514826786893-f4fff6caeff4?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-align: center;
      margin-bottom: 80px;
    }
    .hero-banner h1 {
      font-size: clamp(2.5rem,5vw,4rem);
      margin-bottom: 16px;
    }
    .hero-banner p {
      font-size: 18px;
      margin-bottom: 32px;
    }
    .shop-btn {
      padding: 14px 36px;
      background: #fff;
      color: #2A2420;
      text-decoration: none;
      border-radius: 4px;
      transition: 0.3s;
    }
    .shop-btn:hover {
      background: #8C7853;
      color: #fff;
    }
    .section-title {
      text-align: center;
      font-size: 28px;
      margin-bottom: 40px;
    }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill,minmax(260px,1fr));
      gap: 24px;
    }
    .product-card {
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      transition: 0.3s;
    }
    .product-card:hover {
      transform: translateY(-5px);
    }
    .product-img {
      width: 100%;
      height: 240px;
      object-fit: cover;
    }
    .product-info {
      padding: 16px;
    }
    .product-name {
      font-size: 18px;
      margin-bottom: 8px;
    }
    .product-price {
      color: #8C7853;
      font-weight: 600;
      font-size: 17px;
      margin-bottom: 12px;
    }
    .add-cart-btn {
      width: 100%;
      padding: 10px;
      background: #2A2420;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .add-cart-btn:hover {
      background: #8C7853;
    }
    /* 员工后台样式 */
    #employeeView {
      display: none;
      background: #fff;
      padding: 32px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }
    .btn-group {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
    }
    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      color: #fff;
    }
    .btn-primary {
      background: #8C7853;
    }
    .btn-danger {
      background: #dc3545;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th,td {
      border: 1px solid #eee;
      padding: 10px;
      text-align: left;
    }
    th {
      background: #F5F0EB;
    }
    footer {
      background: #2A2420;
      color: #fff;
      padding: 40px 4%;
      margin-top: 80px;
    }
  </style>
</head>
<body>
  <header>
    <a href="#" class="logo">Carolines-Yarns</a>
    <nav class="nav-wrap">
      <a href="#shop">SHOP</a>
      <a href="#yarn">YARN</a>
      <a href="#tools">TOOLS</a>
      <a href="#about">ABOUT</a>
    </nav>
    <div class="user-bar">
      <button id="loginBtn">SIGN IN</button>
      <span>🛍️</span>
    </div>
  </header>

  <!-- 登录弹窗 原生固定最高层级 -->
  <div id="loginModal">
    <div class="modal-box">
      <button id="closeLogin">×</button>
      <h2>SIGN IN</h2>
      <div class="form-item">
        <label>EMAIL / USERNAME</label>
        <input type="text" id="userAccount" required>
      </div>
      <div class="form-item">
        <label>PASSWORD</label>
        <input type="password" id="userPwd" required>
      </div>
      <button id="submitLogin">SIGN IN</button>
      <p class="tip-text">Employee: admin / admin | Customer: user / user</p>
    </div>
  </div>

  <main>
    <!-- 客户英文前台 -->
    <div id="customerView">
      <section class="hero-banner">
        <h1>PREMIUM YARN & CROCHET TOOLS</h1>
        <p>Luxury materials for your knitting & crochet handmade projects</p>
        <a href="#shop" class="shop-btn">SHOP NOW</a>
      </section>
      <section id="shop">
        <h2 class="section-title">FEATURED PRODUCTS</h2>
        <div class="product-grid" id="productGrid"></div>
      </section>
    </div>

    <!-- 员工中文后台 -->
    <div id="employeeView">
      <h2>员工商品管理后台</h2>
      <div class="btn-group">
        <button class="btn btn-primary" id="addProBtn">添加新商品</button>
        <button class="btn btn-danger" id="logoutBtn">退出登录</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>商品图片</th>
            <th>商品名称</th>
            <th>价格</th>
            <th>库存</th>
            <th>分类</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="proTableBody"></tbody>
      </table>
    </div>
  </main>

  <footer>
    <p>© 2026 Carolines-Yarns All Rights Reserved</p>
  </footer>

  <script>
    // 本地持久存储 刷新不登出
    const storage = window.localStorage;
    const getUser = () => JSON.parse(storage.getItem('userInfo'));
    const setUser = (u) => storage.setItem('userInfo', JSON.stringify(u));
    const clearUser = () => storage.removeItem('userInfo');

    // 账号库
    const userList = [
      {account:'crochetforherhk@gmail.com',pwd:'admin',role:'employee',name:'管理员'},
      {account:'user',pwd:'user',role:'customer',name:'客户'}
    ];

    // 默认商品数据
    let productList = JSON.parse(storage.getItem('productData')) || [
      {id:1,name:'Premium Cotton Yarn',price:12.99,img:'https://images.unsplash.com/photo-1586985450211-65162310c49a?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80',stock:50,category:'Yarn'},
      {id:2,name:'Ergonomic Crochet Hook Set',price:24.99,img:'https://images.unsplash.com/photo-1611506545247-16977815546a?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80',stock:30,category:'Tools'}
    ];
    const saveProduct = () => storage.setItem('productData', JSON.stringify(productList));

    // DOM元素
    const loginBtn = document.getElementById('loginBtn');
    const loginModal = document.getElementById('loginModal');
    const closeLogin = document.getElementById('closeLogin');
    const submitLogin = document.getElementById('submitLogin');
    const accountInput = document.getElementById('userAccount');
    const pwdInput = document.getElementById('userPwd');
    const customerView = document.getElementById('customerView');
    const employeeView = document.getElementById('employeeView');
    const productGrid = document.getElementById('productGrid');
    const proTableBody = document.getElementById('proTableBody');
    const logoutBtn = document.getElementById('logoutBtn');

    // 初始化页面
    function initPage() {
      const loginUser = getUser();
      if(loginUser) {
        loginBtn.innerText = loginUser.role === 'employee' ? 'EMPLOYEE' : 'MY ACCOUNT';
        if(loginUser.role === 'employee') {
          customerView.style.display = 'none';
          employeeView.style.display = 'block';
          renderEmployeeTable();
        } else {
          renderShopProduct();
        }
      } else {
        renderShopProduct();
      }
    }

    // 打开登录弹窗
    loginBtn.onclick = function() {
      loginModal.style.display = 'flex';
    }
    // 关闭弹窗
    closeLogin.onclick = function() {
      loginModal.style.display = 'none';
    }

    // 登录提交
    submitLogin.onclick = function() {
      const acc = accountInput.value.trim();
      const pwd = pwdInput.value.trim();
      const targetUser = userList.find(item => item.account === acc && item.pwd === pwd);
      if(targetUser) {
        setUser(targetUser);
        alert('Login Success!');
        location.reload();
      } else {
        alert('Wrong Username or Password');
      }
    }

    // 渲染客户商品列表
    function renderShopProduct() {
      productGrid.innerHTML = '';
      productList.forEach(item => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <img class="product-img" src="${item.img}" alt="${item.name}">
          <div class="product-info">
            <h3 class="product-name">${item.name}</h3>
            <p class="product-price">$${item.price.toFixed(2)}</p>
            <button class="add-cart-btn">ADD TO CART</button>
          </div>
        `;
        productGrid.appendChild(card);
      })
    }

    // 员工商品表格
    function renderEmployeeTable() {
      proTableBody.innerHTML = '';
      productList.forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><img src="${item.img}" width="80" height="80" style="object-fit:cover"></td>
          <td>${item.name}</td>
          <td>$${item.price}</td>
          <td>${item.stock}</td>
          <td>${item.category}</td>
          <td>
            <button class="btn btn-primary edit-btn" data-id="${item.id}">编辑</button>
            <button class="btn btn-danger del-btn" data-id="${item.id}">删除</button>
          </td>
        `;
        proTableBody.appendChild(tr);
      })
    }

    // 退出登录
    logoutBtn.onclick = function() {
      clearUser();
      location.reload();
    }

    // 页面加载执行
    window.onload = initPage;
  </script>
</body>
</html>
